<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e212b" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
  </defs>

  <!-- Outer Dark Shield / Hexagon -->
  <polygon points="60,4 110,24 110,88 60,116 10,88 10,24" fill="url(#darkGrad)" stroke="url(#redGrad)" stroke-width="3" />
  
  <!-- Outer Gear Teeth Accents -->
  <circle cx="60" cy="58" r="42" fill="none" stroke="url(#redGrad)" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Crown on Top -->
  <path d="M46,26 L52,36 L60,22 L68,36 L74,26 L76,40 L44,40 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1" />
  <circle cx="46" cy="24" r="2" fill="#fde047" />
  <circle cx="60" cy="20" r="2.5" fill="#fde047" />
  <circle cx="74" cy="24" r="2" fill="#fde047" />

  <!-- Motorcycle Silhouette in White/Gold -->
  <!-- Rear wheel -->
  <circle cx="38" cy="68" r="12" fill="none" stroke="#ffffff" stroke-width="3" />
  <circle cx="38" cy="68" r="5" fill="#ef4444" />
  <!-- Front wheel -->
  <circle cx="82" cy="68" r="12" fill="none" stroke="#ffffff" stroke-width="3" />
  <circle cx="82" cy="68" r="5" fill="#ef4444" />
  <!-- Bike Frame / Tank / Handlebar -->
  <path d="M38,68 L50,56 L64,56 L76,46 L78,48 M64,56 L82,68 M50,56 L56,68 L70,68 M44,52 Q56,46 64,52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Crossed Wrenches in Red / Gold -->
  <path d="M30,90 L40,100 M40,90 L30,100" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M80,90 L90,100 M90,90 L80,100" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- RAJA Banner -->
  <rect x="22" y="78" width="76" height="18" rx="4" fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
  <text x="60" y="91" font-family="sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="2">RAJA</text>

  <!-- SINCE 1985 Tag -->
  <text x="60" y="106" font-family="sans-serif" font-weight="800" font-size="7" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">SINCE 1985</text>
</svg>